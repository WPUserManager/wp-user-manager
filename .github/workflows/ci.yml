# WPUM Core CI Pipeline
#
# One Code Quality job: the PHP syntax check on 7.4 to 8.3 in turn, then PHPCS and PHPStan
# on PHP 8.2. Unit tests and E2E are separate workflows (tests.yml, e2e.yml). Nothing runs
# on push, on release branches or on PRs into master: release PRs only change the
# version, and develop's PRs already ran.

name: CI

on:
  pull_request:
    paths:
      - "**.php"
      - "composer.json"
      - "composer.lock"
      - "phpcs.xml.dist"
      - "phpstan.neon.dist"
      - ".github/workflows/ci.yml"
  # A full run on any branch, e.g. develop after a merge: gh workflow run ci.yml --ref develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  code-quality:
    name: Code Quality
    if: github.event_name != 'pull_request' || (!startsWith(github.head_ref, 'release/') && github.base_ref != 'master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none

      - name: Check for fatal errors (PHP 7.4)
        run: |
          php -l wp-user-manager.php
          find includes/ -name "*.php" -print0 | xargs -0 -n1 php -l 2>&1 | { grep -v "No syntax errors" || true; } | { ! grep -q "Parse error"; }

      - name: Setup PHP 8.0
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.0"
          coverage: none

      - name: Check for fatal errors (PHP 8.0)
        run: |
          php -l wp-user-manager.php
          find includes/ -name "*.php" -print0 | xargs -0 -n1 php -l 2>&1 | { grep -v "No syntax errors" || true; } | { ! grep -q "Parse error"; }

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none

      - name: Check for fatal errors (PHP 8.1)
        run: |
          php -l wp-user-manager.php
          find includes/ -name "*.php" -print0 | xargs -0 -n1 php -l 2>&1 | { grep -v "No syntax errors" || true; } | { ! grep -q "Parse error"; }

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Check for fatal errors (PHP 8.2)
        run: |
          php -l wp-user-manager.php
          find includes/ -name "*.php" -print0 | xargs -0 -n1 php -l 2>&1 | { grep -v "No syntax errors" || true; } | { ! grep -q "Parse error"; }

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Check for fatal errors (PHP 8.3)
        run: |
          php -l wp-user-manager.php
          find includes/ -name "*.php" -print0 | xargs -0 -n1 php -l 2>&1 | { grep -v "No syntax errors" || true; } | { ! grep -q "Parse error"; }

      - name: Setup PHP 8.2 for PHPCS and PHPStan
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: cs2pr

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --ignore-platform-reqs

      - name: Detect coding standard violations
        run: vendor/bin/phpcs -q --report=checkstyle | cs2pr --graceful-warnings

      - name: Build scoped vendor (vendor-dist)
        run: |
          mkdir -p release/ci
          cp composer.json composer.lock scoper.inc.php release/ci/
          php -r "
            \$j = json_decode(file_get_contents('release/ci/composer.json'), true);
            \$j['config']['autoloader-suffix'] = 'WPUMScoped';
            file_put_contents('release/ci/composer.json', json_encode(\$j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES));
          "
          bash bin/prefix-dependencies.sh ci
          mv release/ci/vendor-dist ./vendor-dist
          rm -rf release/ci

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G --error-format=github
